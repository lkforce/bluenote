name: Refresh public Discogs metadata
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: discogs-public-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'lkforce/bluenote'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh approved public identifiers only
        run: python scripts/refresh_discogs.py
      - name: Commit public metadata refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data assets/data/search-index.json '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'Refresh Discogs public metadata'
          git push origin HEAD:main
      - name: Request Pages build without changing settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/lkforce/bluenote/pages/builds
